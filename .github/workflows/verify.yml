# Quality gate for every contribution: the checks the publishing pipelines
# would otherwise only fail on after the merge. Required to pass before a pull
# request into main can be merged.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vocabulary-check:
    name: vocabulary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the checker
        run: cargo test --locked --manifest-path tools/vocabulary-check/Cargo.toml
      - name: Check the repository
        run: cargo run --locked --release --manifest-path tools/vocabulary-check/Cargo.toml -- .

  metadata-shacl:
    name: metadata.ttl against the metadata profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshacl==0.40.1
      - name: Validate every metadata.ttl against the newest metadata profile
        run: |
          profile=$(ls -d eonax-metadata-profile/v*/ | sort -V | tail -1)ontology.ttl
          echo "profile: $profile"
          status=0
          for m in */*/metadata.ttl; do
            if out=$(pyshacl -s "$profile" -d "$m" 2>&1); then
              echo "ok   $m"
            else
              echo "FAIL $m"; echo "$out" | sed 's/^/     /'; status=1
            fi
          done
          exit $status

  odrl-profile-shapes:
    name: example policies against the ODRL profile shapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshacl==0.40.1
      - name: Conforming policies conform, violating ones are reported
        run: tools/odrl-shapes-test.sh

  chart-profile-shapes:
    name: example chart datasets against the chart profile shapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshacl==0.40.1
      - name: Conforming datasets conform, violating ones are reported
        run: tools/chart-shapes-test.sh

  netex-generator:
    name: NeTEx generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/netex-generator/requirements.txt
      - name: Cache the pinned NeTEx schema
        id: netex-src
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netex-src
          key: netex-src-${{ hashFiles('tools/netex-generator/sources.json') }}
      - name: Download the pinned NeTEx schema
        if: steps.netex-src.outputs.cache-hit != 'true'
        run: python -I tools/netex-generator/run.py netexgen.fetch --name netex --dest "$RUNNER_TEMP/netex-src"
      - name: Verify the sha256 pins of the cached or downloaded files
        run: python -I tools/netex-generator/run.py netexgen.fetch --name netex --local "$RUNNER_TEMP/netex-src"
      - name: Generator unit tests (smoke tests included)
        env:
          NETEXGEN_SOURCES: ${{ runner.temp }}/netex-src
        run: python -m unittest discover -s tools/netex-generator/tests -t tools/netex-generator
      - name: Committed TTL equals the generator output from the pinned upstream
        env:
          NETEXGEN_SOURCES: ${{ runner.temp }}/netex-src
        run: tools/netex-generator/regenerate.sh --check netex
