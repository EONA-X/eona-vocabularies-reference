# Quality gate for every contribution: the checks the publishing pipelines
# would otherwise only fail on after the merge. Required to pass before a pull
# request into main can be merged.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vocabulary-check:
    name: vocabulary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the checker
        run: cargo test --locked --manifest-path tools/vocabulary-check/Cargo.toml
      - name: Check the repository
        run: cargo run --locked --release --manifest-path tools/vocabulary-check/Cargo.toml -- .

  metadata-shacl:
    name: metadata.ttl against the metadata profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshacl==0.40.1
      - name: Validate every metadata.ttl against the newest metadata profile
        run: |
          profile=$(ls -d eonax-metadata-profile/v*/ | sort -V | tail -1)ontology.ttl
          echo "profile: $profile"
          status=0
          for m in */*/metadata.ttl; do
            if out=$(pyshacl -s "$profile" -d "$m" 2>&1); then
              echo "ok   $m"
            else
              echo "FAIL $m"; echo "$out" | sed 's/^/     /'; status=1
            fi
          done
          exit $status
